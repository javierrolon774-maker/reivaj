<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Servicios Reivaj</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0e7603">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reivaj">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--line:#e4e0d6;--tx:#1b1a17;--mu:#77736a;--ac:#e0a100;--acx:#1a1300;--ok:#168a5a;--bad:#d63a37;--warn:#d9740f;--hl:#fff8e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0f;--card:#18181a;--line:#2a2a2d;--tx:#f2f0ea;--mu:#8d8b86;--ac:#f0b323;--ok:#3ecf8e;--bad:#ef5350;--warn:#f08a23;--hl:#241d08}}
:root[data-theme="dark"]{--bg:#0e0e0f;--card:#18181a;--line:#2a2a2d;--tx:#f2f0ea;--mu:#8d8b86;--ac:#f0b323;--ok:#3ecf8e;--bad:#ef5350;--warn:#f08a23;--hl:#241d08}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:400 14px/1.4 Sora,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
header b{font-size:15px;letter-spacing:.2px}
header span{color:var(--ac)}
.ib{background:var(--card);border:1px solid var(--line);color:var(--tx);width:34px;height:34px;border-radius:50%;cursor:pointer;font:inherit;margin-left:6px}
#main{flex:1;overflow-y:auto;padding:0 16px 16px}
h1{font-size:28px;margin:10px 0 0;font-weight:700;letter-spacing:-.5px}
.sub{color:var(--mu);margin:2px 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--card);border-radius:14px;margin-bottom:12px}
.stats div{padding:10px 4px;text-align:center;border-right:1px solid var(--line)}
.stats div:last-child{border:0}
.stats b{display:block;font-size:22px}
.stats small{color:var(--mu);font-size:10px;line-height:1.2;display:block}
input,select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;margin-bottom:10px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--tx);background:var(--card);font-weight:600}
.chip b{margin-left:4px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.bd{flex:none;width:44px;height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:18px;line-height:1;color:#fff}
.bd small{font-size:9px;font-weight:400;margin-top:2px}
.info{flex:1;min-width:0}
.info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{color:var(--mu);font-size:12px;display:block}
.act{display:flex;gap:6px}
.act a,.act button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ok);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;font:inherit;font-size:16px}
.act button{color:var(--tx)}
.big{width:100%;background:var(--ac);color:var(--acx);border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;cursor:pointer;margin-bottom:8px}
.big[disabled]{opacity:.55}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;font-size:12px;cursor:pointer}
.tag{font-size:11px;color:var(--ok);border:1px solid var(--ok);border-radius:8px;padding:2px 6px}
.amt{font-weight:700;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:36px 12px}
.empty b{display:block;color:var(--tx);margin-bottom:4px}
label{display:block;color:var(--mu);font-size:12px;margin:4px 0 4px 2px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 8px;font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ac);font-weight:600}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lg{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;position:relative;overflow:hidden;flex:none;letter-spacing:-.3px}.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
#lock{position:absolute;inset:0;background:var(--bg);z-index:6;padding:90px 24px;text-align:center}#lock[hidden]{display:none}#lock img{width:120px;height:120px;border-radius:26px;margin-bottom:14px}#lock .big{margin-top:18px}#lock .lnk{background:none;border:0;color:var(--mu);font:inherit;margin-top:18px;cursor:pointer;text-decoration:underline}
img.bn{display:block;width:100%;height:auto;border-radius:16px;margin:0 0 18px}#lock img.bn{width:100%;height:auto;border-radius:16px;margin:0 0 18px}#login{position:absolute;inset:0;background:var(--bg);z-index:5;padding:40px 24px;overflow:auto}#login[hidden]{display:none}
#lst .sec{margin-bottom:6px}
.shd{width:100%;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;color:var(--tx);font:inherit;cursor:pointer;text-align:left}
.shd b{flex:1}.shd span{color:var(--mu);font-size:12px}.shd i{font-style:normal;color:var(--mu);width:14px;text-align:center}
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:6;display:flex;align-items:flex-end}#sheet[hidden]{display:none}
.pane{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:16px 16px 20px;max-height:92%;overflow:auto}
.info[data-a]{cursor:pointer}
#toast{z-index:9;position:absolute;left:16px;right:16px;bottom:74px;background:var(--tx);color:var(--bg);padding:11px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;font-size:13px;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head>
<body><div id="app">
<header><b style="display:flex;align-items:center;gap:10px"><img src="icons/icon-192.png" alt="" width="34" height="34" style="border-radius:9px">Servicios <span>Reivaj</span></b><div><button class="ib" data-a="theme" title="Cambiar tema" aria-label="Cambiar tema">◐</button><button class="ib" data-a="reset" title="Actualizar datos" aria-label="Actualizar datos">↺</button><button class="ib" data-a="bio" title="Huella" aria-label="Activar o desactivar huella">☝</button><button class="ib" data-a="logout" title="Cerrar sesión" aria-label="Cerrar sesión">⎋</button></div></header>
<div id="lock" hidden><img class="bn" src="icons/banner.jpg" alt="Servicios Reivaj"><h1>Servicios Reivaj</h1><p class="sub">Desbloquea con tu huella</p><button class="big" data-a="unlock">Desbloquear</button><br><button class="lnk" data-a="usepw">Usar contraseña</button></div>
<div id="login" hidden><img class="bn" src="icons/banner.jpg" alt="Servicios Reivaj"><h1>Entrar</h1><p class="sub">Inicia sesión con tu usuario de Supabase</p><label for="le">Correo</label><input id="le" type="email" autocomplete="username"><label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password"><button class="big" data-a="login">Entrar</button></div>
<div id="main"></div><div id="sheet" hidden></div><div id="toast"></div>
<nav id="nav"></nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s),T=new Date();T.setHours(0,0,0,0);
const DAY=864e5,ts=n=>T.getTime()+n*DAY,dd=t=>Math.round((t-T.getTime())/DAY);
const p2=n=>String(n).padStart(2,'0'),fd=t=>{const d=new Date(t);return p2(d.getDate())+'/'+p2(d.getMonth()+1)};
const gs=n=>'Gs. '+Number(n).toLocaleString('es-PY');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tok=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/).filter(w=>w.length>2);
const PRE={'Netflix':30000,'Netflix Privado':40000,'Spotify':25000,'Prime Video (cuenta)':20000,'Paramount':20000,'Max':25000,'Crunchyroll':20000,'Disney+':35000,'Disney+ (cuenta)':35000,'Tigo Sports':40000,'MagisTv':60000};
const svOpts=(cur)=>(cur&&!SVC.includes(cur)?`<option value="${esc(cur)}" selected>${esc(cur)} (no está en el Sheet)</option>`:'')+SVC.map(x=>`<option value="${esc(x)}" ${x==cur?'selected':''}>${esc(x)}</option>`).join('');
const SVC=['Crunchyroll', 'Disney+', 'Disney+ (cuenta)', 'MagisTv', 'Max', 'Max (cuenta)', 'Netflix', 'Netflix Privado', 'Paramount', 'Paramount (cuenta)', 'Prime Video (cuenta)', 'Spotify', 'YouTube Premium','Tigo Sports'];
const seed=()=>({id:30,
clients:[['Ana Giménez','595981100001','Disney Premium',15000,0],['Carlos Duarte','595982100002','Tigo Sports',70000,0],['Lucía Benítez','595983100003','Netflix-Premium',30000,0],['Marcos Ríos','595984100004','Spotify',25000,3],['Sofía Acosta','595985100005','HBO Max',25000,9],['Julián Vera','595986100006','Netflix',30000,-2],['Mabel Cáceres','595971100007','Disney Premium',15000,-5],['Diego Fleitas','595972100008','Netflix-Premium',30000,2],['Rocío Salinas','595973100009','HBO Max',25000,6],['Hugo Samaniego','595974100010','Spotify',25000,15],['Elena Ortiz','595975100011','Tigo Sports',70000,1],['Pablo Insfrán','595976100012','Netflix',30000,22]].map((a,i)=>({id:i+1,n:a[0],tel:a[1],svc:a[2],p:a[3],due:ts(a[4]),on:1})).concat([{id:20,n:'Nadia Pereira',tel:'595977100013',svc:'Spotify',p:25000,due:ts(-40),on:0}]),
pays:[],
accts:[{m:'disney.01@correo.com',svc:'Disney Premium',cap:4,used:3},{m:'netflix.02@correo.com',svc:'Netflix-Premium',cap:5,used:2},{m:'hbo.01@correo.com',svc:'HBO Max',cap:3,used:2},{m:'spotify.03@correo.com',svc:'Spotify',cap:6,used:0},{m:'tigo.01@correo.com',svc:'Tigo Sports',cap:2,used:2}]});
const CFG={url:'https://pecfmxzvkyxrftyjorxz.supabase.co',key:'sb_publishable_L1Zgo3HA0ji-Xeg6pogrjg_LwTtZg-p'};
const sb=window.supabase.createClient(CFG.url.startsWith('http')?CFG.url:'https://x.supabase.co',CFG.key);
let S={clients:[],pays:[],accts:[]};
const save=()=>{};
const isoD=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const dbErr=r=>{if(r&&r.error)toast('Error: '+r.error.message)};
const enq=(tipo,datos)=>sb.from('cambios').insert({tipo,datos}).then(r=>{if(r.error)toast('No se pudo anotar el cambio para el Sheet: '+r.error.message)});
let accCl='';
async function pull(){const [c,p,a,k,ce,hk]=await Promise.all([sb.from('clientes').select('*'),sb.from('pagos').select('*').order('id',{ascending:false}),sb.from('cuentas').select('*'),sb.from('credenciales').select('cuenta_id,clave'),sb.from('cambios').select('id,tipo,datos,error').eq('estado','error'),sb.from('ajustes').select('valor').eq('clave','hook').maybeSingle()]);S.cerr=ce&&!ce.error?(ce.data||[]):[];S.hook=(hk&&hk.data&&hk.data.valor)||S.hook||'';
S.cred={};(k.data||[]).forEach(r=>{S.cred[r.cuenta_id]=r.clave||''});
const e=c.error||p.error||a.error;if(e){toast('Error: '+e.message);return}
S.clients=c.data.map(r=>({id:r.id,n:r.nombre,tel:r.telefono,svc:r.servicio,p:r.precio,due:new Date(r.vence+'T00:00:00').getTime(),on:r.activo?1:0,mail:(r.correo||'').toLowerCase(),note:r.nota||'',perfil:r.perfil||'',pin:r.pin||'',k:r.clave_hoja||''}));
S.pays=p.data.map(r=>({id:r.id,n:r.remitente,amt:r.monto,bank:r.banco||'',t:r.hora||'',used:r.cliente_id||0,arch:!!r.archivado,f:new Date(r.fecha||r.creado).getTime()}));
S.accts=a.data.map(r=>({id:r.id,m:r.correo,svc:r.servicio,cap:r.capacidad,used:r.ocupados})).sort((x,y)=>x.svc.localeCompare(y.svc)||x.m.localeCompare(y.m));render()}
async function edit(id){const c=S.clients.find(x=>x.id==id);if(!c)return;
const ac=c.mail?S.accts.find(x=>String(x.m).trim().toLowerCase()==c.mail&&x.svc==c.svc):null;let cl='';
if(ac){const r=await sb.from('credenciales').select('clave').eq('cuenta_id',ac.id).maybeSingle();cl=(r.data&&r.data.clave)||''}
const fl=(id2,lab,val,ro,extraAttr)=>`<label for="${id2}">${lab}</label><div style="display:flex;gap:8px"><input id="${id2}" value="${esc(val)}" ${ro?'readonly':''} ${extraAttr||''} autocomplete="off"><button class="chip" data-a="copy" data-t="${id2}" style="margin-bottom:10px">Copiar</button></div>`;
const wad=c.tel&&(c.mail||cl)?`<a class="chip" style="display:block;text-align:center;text-decoration:none;color:var(--ok);margin:2px 0 4px" target="_blank" rel="noopener" href="https://api.whatsapp.com/send?phone=${c.tel.replace(/\D/g,'')}&text=${encodeURIComponent(msgD(c,cl))}">Enviar datos por WhatsApp</a>`:'';
$('#sheet').innerHTML=`<div class="pane"><h1 style="font-size:22px">Editar cliente</h1><p class="sub">${esc(c.n)}</p>
<div style="border:1px solid var(--line);border-radius:14px;padding:2px 12px 10px;margin-bottom:12px"><p class="sub" style="margin:10px 0 0;font-size:12px;letter-spacing:.5px">DATOS DE LA CUENTA</p>
${c.mail?fl('dc','Correo',c.mail,true):'<p class="sub" style="font-size:13px">Sin correo cargado: se llena al sincronizar la hoja.</p>'}
${cl?`<label for="ak">Clave</label><div style="display:flex;gap:8px"><input id="ak" type="password" value="${esc(cl)}" readonly><button class="chip" data-a="show" style="margin-bottom:10px">Ver</button><button class="chip" data-a="copy" data-t="ak" style="margin-bottom:10px">Copiar</button></div>`:(c.mail?'<p class="sub" style="font-size:13px">Esta cuenta aún no tiene clave guardada.</p>':'')}
${fl('epf','Usuario / perfil',c.perfil||'',false)}
${fl('epn','PIN',c.pin||'',false,'inputmode="numeric"')}
${wad}</div>
<label for="en">Nombre</label><input id="en" value="${esc(c.n)}">
<label for="et">WhatsApp (con código de país)</label><input id="et" inputmode="tel" value="${esc(c.tel)}">
<label for="es">Servicio</label><select id="es">${svOpts(c.svc)}</select>
<label for="ep">Precio que paga (Gs.)</label><input id="ep" type="number" inputmode="numeric" value="${c.p}">
<label for="ed">Vence</label><input id="ed" type="date" value="${isoD(c.due)}">
<label for="eno">Nota (ej: en qué cuenta de Netflix está)</label><input id="eno" value="${esc(c.note||'')}" autocomplete="off">
<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="ea" ${c.on?'checked':''} style="width:auto;margin:0"> Cliente activo <small style="color:var(--mu)">(si lo desmarcás, se libera su lugar en el Sheet)</small></label>
<button class="big" style="margin-top:12px" data-a="esave" data-id="${id}">Guardar cambios</button>
<button class="chip" style="width:100%;padding:11px" data-a="eclose">Cancelar</button></div>`;$('#sheet').hidden=false}
async function esave(id){const v=i=>$('#'+i).value.trim();if(!v('en')||!v('ed')){toast('Completa nombre y fecha');return}
const old=S.clients.find(x=>x.id==id),nv={nombre:v('en'),telefono:v('et').replace(/\D/g,''),servicio:v('es')||'Sin servicio',precio:+v('ep')||0,vence:v('ed'),perfil:v('epf'),pin:v('epn')};
const r=await sb.from('clientes').update({nombre:nv.nombre,telefono:nv.telefono,servicio:nv.servicio,precio:nv.precio,vence:nv.vence,nota:v('eno')||null,perfil:nv.perfil||null,pin:nv.pin||null,activo:$('#ea').checked}).eq('id',id);
if(r.error){toast('Error: '+r.error.message);return}
if(old){const ref={id:old.id,k:old.k,nombre:old.n,telefono:old.tel,servicio:old.svc};
if(old.on&&!$('#ea').checked)enq('cancelar',ref);
else{const nu={},t8=x=>String(x||'').replace(/\D/g,'').slice(-8);
if(nv.nombre!==old.n.trim())nu.nombre=nv.nombre;if(t8(nv.telefono)!==t8(old.tel))nu.telefono=nv.telefono;if(nv.servicio!==old.svc)nu.servicio=nv.servicio;
if(nv.precio!==+old.p)nu.precio=nv.precio;if(nv.vence!==isoD(old.due))nu.vence=nv.vence;if(nv.perfil!==(old.perfil||''))nu.perfil=nv.perfil;if(nv.pin!==(old.pin||''))nu.pin=nv.pin;
if(Object.keys(nu).length)enq('editar',{id:old.id,k:old.k,viejo:{nombre:old.n,telefono:old.tel,servicio:old.svc},nuevo:nu,todo:nv})}}$('#sheet').hidden=true;toast('Cambios guardados');pull()}
function usersOf(a){const us=S.clients.filter(c=>c.on&&c.mail&&c.mail==String(a.m).trim().toLowerCase()&&c.svc==a.svc).sort((x,y)=>x.due-y.due);
const nk=us.filter(c=>c.on&&c.tel).length;
const h=`<h2 style="font-size:15px;margin:16px 0 8px">Usuarios de esta cuenta <small style="color:var(--mu)">(${us.length})</small></h2>`+(nk?`<button class="chip" data-a="kall" data-id="${a.id}" style="width:100%;margin-bottom:10px;padding:10px">🔐 Avisar cambio de clave a los ${nk} usuarios</button>`:'');
if(!us.length)return h+'<div class="empty" style="padding:10px 0"><span style="font-size:13px">Todavía no hay usuarios cargados. Se llenan solos al sincronizar la hoja.</span></div>';
return h+us.map(c=>{const d=dd(c.due),y=new Date(c.due).getFullYear();return `<div class="row"><div class="bd" style="background:${c.on?col(d):'var(--mu)'}">${c.on?d:'—'}<small>${c.on?'días':'baja'}</small></div><div class="info"><b>${esc(c.n)}</b><span><a href="tel:+${c.tel.replace(/\D/g,'')}" style="color:inherit">${esc(c.tel||'sin número')}</a></span><span>Vence ${fd(c.due)}/${y}</span>${extra(c)}</div><div class="act">${keyBtn(c)}${c.tel?`<a href="${wa(c)}" target="_blank" rel="noopener" aria-label="WhatsApp a ${esc(c.n)}">${WAI}</a>`:''}</div></div>`}).join('')}
async function acct(id){kAcc=null;kIdx=0;const a=S.accts.find(x=>x.id==id)||{id:0,m:'',svc:SVC[0],cap:4,used:0};let cl='',nt='';
if(a.id){const r=await sb.from('credenciales').select('clave,nota').eq('cuenta_id',a.id).maybeSingle();if(r.error){toast('Error: '+r.error.message);return}cl=(r.data&&r.data.clave)||'';nt=(r.data&&r.data.nota)||''}accCl=cl;
$('#sheet').innerHTML=`<div class="pane"><h1 style="font-size:22px">${a.id?'Cuenta':'Nueva cuenta'}</h1><p class="sub">${esc(a.svc)}</p>
<label for="ac">Correo o usuario</label><div style="display:flex;gap:8px"><input id="ac" value="${esc(a.m)}" autocomplete="off"><button class="chip" data-a="copy" data-t="ac" style="margin-bottom:10px">Copiar</button></div>
<label for="ak">Contraseña</label><div style="display:flex;gap:8px"><input id="ak" type="password" value="${esc(cl)}" autocomplete="off"><button class="chip" data-a="show" style="margin-bottom:10px">Ver</button><button class="chip" data-a="copy" data-t="ak" style="margin-bottom:10px">Copiar</button></div>

cli(){return `<h1>Clientes</h1><p class="sub">${S.clients.length} en la base</p><input id="q" placeholder="Nombre, teléfono o servicio" value="${esc(q)}"><div class="chips">${[['on','Activos'],['all','Todos'],['off','De baja']].map(([k,l])=>`<button class="chip ${cf==k?'on':''}" data-a="cf" data-k="${k}">${l}</button>`).join('')}</div><div id="lst">${L.cli()}</div>`},
pag(){const ps=pagosF(),tot=ps.reduce((s,p)=>s+p.amt,0),un=ps.filter(p=>!p.used&&!p.arch).length;
return `<h1>Pagos</h1><p class="sub">Transferencias recibidas</p><div class="chips">${[['s7','Últimos 7 días'],['mes','Este mes'],['todo','Todos']].map(([k,l])=>`<button class="chip ${pf==k?'on':''}" data-a="pf" data-k="${k}">${l}</button>`).join('')}</div><div class="stats" style="grid-template-columns:repeat(3,1fr)">${st(tot.toLocaleString('es-PY'),'Total','var(--tx)')}${st(ps.length,'Transferencias','var(--tx)')}${st(un,'Sin usar','var(--warn)')}</div><button class="big" data-a="load" ${loading?'disabled':''}>${loading?'Actualizando…':'Actualizar'}</button><input id="q" placeholder="Buscar por nombre o banco" value="${esc(q)}"><div id="lst">${L.pag()}</div>`},
cue(){return `<h1>Cuentas</h1><p class="sub">Toca un servicio para ver sus cuentas</p><button class="big" data-a="acct" data-id="0">Agregar cuenta</button><input id="q" placeholder="Buscar por correo o servicio" value="${esc(q)}"><div id="lst">${L.cue()}</div>`},
nue(){return `<h1>Nuevo cliente</h1><p class="sub">Registra una venta</p><label for="fn">Nombre</label><input id="fn" autocomplete="off"><label for="ft">WhatsApp (con código de país)</label><input id="ft" inputmode="tel" placeholder="595981123456"><datalist id="svl">${SVC.map(s=>`<option value="${esc(s)}">`).join('')}</datalist><div id="svs">${blk(true)}</div><button class="chip" data-a="addsv" style="margin:8px 0 12px">+ Agregar otro servicio</button><button class="big" data-a="save">Guardar cliente</button>`}};
const NAV=[['ven','Vencen','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],['cli','Clientes','<circle cx="9" cy="8" r="3.5"/><path d="M2.500 20c.5-4 3-6 6.500-6s6 2 6.500 6M16 4.500a3.500 3.500 0 0 1 0 7M18 14c2 .7 3.200 2.600 3.500 6"/>'],['pag','Pagos','<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.500"/>'],['cue','Cuentas','<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>'],['nue','Nuevo','<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>']];
function render(){$('#main').innerHTML=V[tab]();$('#nav').innerHTML=NAV.map(n=>`<button class="${tab==n[0]?'on':''}" data-a="tab" data-k="${n[0]}"><svg viewBox="0 0 24 24">${n[2]}</svg>${n[1]}</button>`).join('')}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a=='tab'){tab=b.dataset.k;q='';render()}
else if(a=='f'){f=b.dataset.k;render()}
else if(a=='cf'){cf=b.dataset.k;render()}
else if(a=='renew'){renew(id);render()}
else if(a=='load')load();
else if(a=='use'){use(id,b.dataset.c);$('#sheet').hidden=true}
else if(a=='pickopen')pickOpen(id);
else if(a=='arch'||a=='unarch'){const p=S.pays.find(x=>x.id==id);if(p){p.arch=a=='arch';sb.from('pagos').update({archivado:p.arch}).eq('id',p.id).then(dbErr);render();toast(p.arch?'Marcado como registrado (no se cambió ninguna fecha)':'Listo, vuelve a estar sin usar')}}
else if(a=='pf'){pf=b.dataset.k;render()}
else if(a=='save')add();
else if(a=='login')doLogin();
else if(a=='edit')edit(id);
else if(a=='esave')esave(id);
else if(a=='eclose')$('#sheet').hidden=true;
else if(a=='sec'){const k=b.dataset.k;openS.has(k)?openS.delete(k):openS.add(k);$('#lst').innerHTML=L.cue()}
else if(a=='acct')acct(id);
else if(a=='kall'){const ac=S.accts.find(x=>x.id==id);if(!ac)return;const us=S.clients.filter(c=>c.on&&c.tel&&c.mail&&c.mail==String(ac.m).trim().toLowerCase()&&c.svc==ac.svc).sort((x,y)=>x.due-y.due);
const clave=($('#ak')&&$('#ak').value)||'';if(!clave){toast('Esta cuenta no tiene clave guardada');return}
if(!us.length)return;if(kAcc!=id){kAcc=id;kIdx=0}const c=us[kIdx%us.length];window.open(wl(c,msgK(c,clave)),'_blank');kIdx++;
b.textContent=kIdx%us.length==0?`✅ Listo, se avisó a los ${us.length}. Tocar para repetir`:`🔐 Avisar al siguiente: ${us[kIdx%us.length].n.split(' ')[0]} (${kIdx+1} de ${us.length})`}
else if(a=='asave')asave(id);
else if(a=='copy')copyF(b.dataset.t);
else if(a=='show'){const i=$('#ak');i.type=i.type=='password'?'text':'password';b.textContent=i.type=='password'?'Ver':'Ocultar'}
else if(a=='theme'){const r=document.documentElement,d=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=d=='dark'?'light':'dark'}
else if(a=='reset'){pull();toast('Datos actualizados')}
else if(a=='addsv'){$('#svs').insertAdjacentHTML('beforeend',blk(false))}
else if(a=='rmsv'){b.closest('.svb').remove()}
else if(a=='bio'){bioId()?bioOff():bioOn()}
else if(a=='unlock')unlock();
else if(a=='cerr'){alert(S.cerr.map(x=>((x.datos&&(x.datos.nombre||(x.datos.viejo&&x.datos.viejo.nombre)||x.datos.correo))||x.tipo)+': '+x.error).join('\n')+'\n\nCárgalo a mano en el Sheet. Este aviso se borra al cerrar.');sb.from('cambios').delete().eq('estado','error').then(()=>pull())}
else if(a=='usepw'){bioOff();sb.auth.signOut().then(()=>{$('#lock').hidden=true;$('#login').hidden=false})}
else if(a=='logout'){if(bioId()){S.clients=[];S.accts=[];$('#lock').hidden=false;return}sb.auth.signOut().then(()=>{S.clients=[];S.accts=[];$('#lp').value='';$('#login').hidden=false})}});
function fillAcc(b){const sel=b.querySelector('.sv-c'),sv=b.querySelector('.sv-s').value.trim().toLowerCase();if(!sel)return;
sel.innerHTML='<option value="">Sin cuenta por ahora</option>'+S.accts.filter(a=>String(a.svc).toLowerCase()==sv&&a.cap-a.used>0).map(a=>`<option value="${a.id}">${esc(a.m)} · ${a.cap-a.used} libre${a.cap-a.used>1?'s':''}</option>`).join('')}
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#lst').innerHTML=L[tab]()}else if(e.target.id=='pq')$('#pl').innerHTML=pickList(pickPid,e.target.value);else if(e.target.classList&&e.target.classList.contains('sv-s'))fillAcc(e.target.closest('.svb'))});
document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('sv-s')){const b=e.target.closest('.svb');if(PRE[e.target.value])b.querySelector('.sv-p').value=PRE[e.target.value];fillAcc(b)}});
document.addEventListener('change',e=>{if(e.target.id=='as'){const o=$('#as2');o.hidden=e.target.value!='__otro';if(!o.hidden)o.focus()}
if(e.target.dataset.a=='pick'&&e.target.value)use(e.target.dataset.id,e.target.value)});
render();
if(CFG.url.startsWith('http')){sb.auth.getSession().then(({data})=>{if(data.session){if(bioId()){$('#lock').hidden=false;unlock()}else pull()}else $('#login').hidden=false})}
else $('#main').innerHTML='<div class="empty"><b>Falta configurar Supabase</b>Pega tu URL y tu anon key en CFG, al inicio del script.</div>';
</script></body></html>
